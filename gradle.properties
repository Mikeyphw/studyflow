org.gradle.jvmargs=-Xmx1280m -XX:MaxMetaspaceSize=640m -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.parallel=true
org.gradle.workers.max=2
android.useAndroidX=true
android.nonTransitiveRClass=true
android.defaults.buildfeatures.resvalues=false
android.defaults.buildfeatures.shaders=false
kotlin.code.style=official

# AGP 9 built-in Kotlin is the single Android Kotlin owner.
android.builtInKotlin=true

# Devtool passes android.aapt2FromMavenOverride during Android validation.
android.sync.suppressAgpWarnings=UNSUPPORTED_PROJECT_OPTION_USE
org.gradle.daemon=true
org.gradle.vfs.watch=false
kotlin.incremental=true
kotlin.compiler.execution.strategy=in-process

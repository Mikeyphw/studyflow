// SFDT19 HF04: hosted-only, source-bound download of Desktop and Kotlin toolchain JARs.
// This does not compile, test, package, publish, or configure release signing.
// The native Devtool RM12 JVM job remains the sole Desktop test executor.
import org.gradle.api.GradleException
import org.gradle.api.artifacts.component.ModuleComponentIdentifier

gradle.beforeProject { project ->
    if (project.path != ':desktopApp') {
        return
    }
    project.tasks.register('sfdt19MaterializeDesktopExternalArtifacts') {
        group = 'verification'
        description = 'Resolve the exact external Desktop compile/test artifacts for offline native RM12 CI'
        doLast {
            def configurations = [
                'compileClasspath', 'runtimeClasspath',
                'testCompileClasspath', 'testRuntimeClasspath',
                // HF04: the native KotlinCompile task resolves these separately
                // from application compile/test classpaths in --offline mode.
                'kotlinBuildToolsApiClasspath',
            ]
            // Other Kotlin-owned compiler/plugin classpaths, when registered,
            // also require actual JAR bytes. Only literal known configuration
            // names are admitted; Android sibling projects are never touched.
            [
                'kotlinCompilerClasspath',
                'kotlinCompilerPluginClasspathMain',
                'kotlinCompilerPluginClasspathTest',
            ].each { candidate ->
                def optional = project.configurations.findByName(candidate)
                if (optional != null && optional.canBeResolved) {
                    configurations.add(candidate)
                }
            }
            configurations.each { name ->
                def configuration = project.configurations.findByName(name)
                if (configuration == null || !configuration.canBeResolved) {
                    throw new GradleException('SFDT19_PREWARM_REFUSED: unresolved configuration ' + name)
                }
                // A dependency report may resolve only module metadata. An
                // artifact view forces external JAR bytes into the Gradle cache.
                // Project components are excluded: they are compiled only by
                // the subsequent native Devtool JVM test job.
                def external = configuration.incoming.artifactView {
                    componentFilter { component ->
                        component instanceof ModuleComponentIdentifier
                    }
                }.files.files
                if (external.isEmpty() || external.size() > 2048) {
                    throw new GradleException('SFDT19_PREWARM_REFUSED: missing/unbounded external artifacts ' + name)
                }
                external.each { artifact ->
                    if (!artifact.isFile() || !artifact.canRead() || artifact.length() == 0L) {
                        throw new GradleException('SFDT19_PREWARM_REFUSED: missing/empty artifact in ' + name)
                    }
                }
                if (name == 'kotlinBuildToolsApiClasspath') {
                    // Independently require the two exact binaries missing in
                    // hosted run 42393798945. Metadata or just POMs do not pass.
                    ['kotlin-build-tools-compat-2.4.10',
                     'kotlin-build-tools-impl-2.4.10'].each { prefix ->
                        if (!external.any { file ->
                            file.name.startsWith(prefix) && file.name.endsWith('.jar')
                        }) {
                            throw new GradleException('SFDT19_PREWARM_REFUSED: missing Kotlin build-tools JAR ' + prefix)
                        }
                    }
                }
                println "SFDT19_DESKTOP_ARTIFACT_BYTES_PASS: ${name} ${external.size()} files"
            }
        }
    }
}

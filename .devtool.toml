[project]
kind = "android"

default_target = "studyflow_desktop"
[execution]
environment = "auto"
chroot_name = "androidos"

[targets.studyflow_android]
type = "android"
root = "."
execution_environment = "native-termux"
chroot_name = "androidos"

[targets.studyflow_android.android]
variant = "debug"
aapt2_provider = "termux"
instrumentation = "when-device-present"
prefer_native_termux = true
ndk_version = "29.0.14206865"

[targets.studyflow_android.gradle]
version = "9.7.1"
provider = "auto"
max_workers = 1
parallel = false
no_daemon = false
daemon_idle_timeout_ms = 900000
build_cache = true
structured_events = false
fail_fast = true
offline = false
args = [
  "-Dorg.gradle.parallel=true",
  "-Dorg.gradle.vfs.watch=false",
  "-Pkotlin.incremental=true",
  "-Pkotlin.compiler.execution.strategy=in-process",
]


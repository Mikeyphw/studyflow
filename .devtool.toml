# StudyFlow Devtool configuration — task-graph optimized v4.
# Canonical runner/platform keys and [workspace].default_target follow the current Devtool schema.
[project]
runner = "android"
platform = "android"

[workspace]
default_target = "studyflow_android"

[workspace.groups]
clients = ["studyflow_android", "studyflow_desktop", "studyflow_web", "studyflow_tv"]
mobile = ["studyflow_android", "studyflow_tv"]
release = ["studyflow_release", "studyflow_tv_release", "studyflow_parity"]
quality = ["studyflow_quality"]
everything = ["@clients", "@release", "@quality"]

[workspace.scheduler]
parallel = true
max_parallel_nodes = 2
max_gradle_nodes = 1

[execution]
environment = "auto"
chroot_name = "androidos"

[targets.studyflow_android]
runner = "android"
platform = "android"
root = "."
affected_ownership = "inputs-only"
execution_environment = "native-termux"
chroot_name = "androidos"
inputs = [
    ".devtool.toml",
    "settings.gradle.kts",
    "build.gradle.kts",
    "gradle/**",
    "build-logic/**",
    "app/**",
    "core/**",
    "feature/**",
    "protocol/**",
    "tools/**",
    "gradlew",
    "gradle.properties",
    "scripts/**",
    ".github/workflows/*.yml",
]
outputs = [
    "app/build/**",
    "build/devtool/**",
]

[targets.studyflow_android.android]
variant = "debug"
aapt2_provider = "termux"
prefer_native_termux = true
ndk_version = "29.0.14206865"

[targets.studyflow_android.android.adb]
provider = "auto"
device_policy = "first-physical"

[targets.studyflow_android.android.signing.release]
mode = "devtool"
policy = "release-required"
keystore = "~/.config/studyflow/signing/studyflow-release.p12"
alias = "studyflow-release"
store_file_env = "STUDYFLOW_RELEASE_STORE_FILE"
key_alias_env = "STUDYFLOW_RELEASE_KEY_ALIAS"
store_password_env = "STUDYFLOW_RELEASE_STORE_PASSWORD"
key_password_env = "STUDYFLOW_RELEASE_KEY_PASSWORD"

[targets.studyflow_android.android.instrumentation]
policy = "when-device-present"
keep_installed = false
cleanup_app = false
capture_logcat_on_failure = true
capture_screenshot_on_failure = true

[targets.studyflow_android.gradle]
version = "9.7.1"
provider = "auto"
max_workers = 4
parallel = true
no_daemon = false
daemon_idle_timeout_ms = 900000
build_cache = true
structured_events = true
fail_fast = false
offline = false
args = [
  "-Dorg.gradle.vfs.watch=false",
  "-Pkotlin.incremental=true",
  "-Pkotlin.compiler.execution.strategy=in-process",
]

[targets.studyflow_android.tasks]
build = ["verifyStudyFlowAndroidPreflightContracts", "prepareDevtoolValidationArtifacts", ":app:assembleDebug", "verifyOv30StudyflowAndroidTargetSeal", "verifyOv30R2StudyflowAndroidProperValidationSeal"]

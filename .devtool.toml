# StudyFlow Devtool configuration — task-graph optimized v4.
# Canonical runner/platform keys and [workspace].default_target follow the current Devtool schema.
[project]
runner = "android"
platform = "android"

[workspace]
default_target = "studyflow_android"

[workspace.groups]
clients = ["studyflow_android", "studyflow_desktop", "studyflow_web", "studyflow_tv"]
mobile = ["studyflow_android", "studyflow_tv"]
release = ["studyflow_release", "studyflow_tv_release", "studyflow_parity"]
quality = ["studyflow_quality"]
everything = ["@clients", "@release", "@quality"]

[workspace.scheduler]
parallel = true
max_parallel_nodes = 2
max_gradle_nodes = 1

[execution]
environment = "auto"
chroot_name = "androidos"

[targets.studyflow_android]
runner = "android"
platform = "android"
root = "."
execution_environment = "native-termux"
chroot_name = "androidos"

[targets.studyflow_android.android]
variant = "debug"
aapt2_provider = "termux"
prefer_native_termux = true
ndk_version = "29.0.14206865"

[targets.studyflow_android.android.adb]
provider = "auto"
device_policy = "first-physical"

[targets.studyflow_android.android.instrumentation]
policy = "when-device-present"
keep_installed = false
cleanup_app = false
capture_logcat_on_failure = true
capture_screenshot_on_failure = true

[targets.studyflow_android.gradle]
version = "9.7.1"
provider = "auto"
max_workers = 4
parallel = true
no_daemon = false
daemon_idle_timeout_ms = 900000
build_cache = true
structured_events = false
fail_fast = false
offline = false
args = [
  "-Dorg.gradle.vfs.watch=false",
  "-Pkotlin.incremental=true",
  "-Pkotlin.compiler.execution.strategy=in-process",
]

[targets.studyflow_android.tasks]
build = ["verifyStudyFlowAndroidPreflightContracts", "prepareDevtoolValidationArtifacts", ":app:assembleDebug"]
test = [
  "verifyStudyFlowAndroidPreflightContracts",
  "verifyOv09SflpNativeWebInterop",
  "verifyOv10SflpTrustSecurity",
  "verifyOv11SflpReconciliationRecovery",
  "verifySflp24FinalReleaseSeal",
  "verifyAttentionRoadmapPostsealCompletion",
  "verifyRel07Rel08FinalReleaseOpsSeal",
  "verifyFinalSourceAcceptance",
  ":core:data:testDebugUnitTest",
  ":core:database:testDebugUnitTest",
  ":core:diagnostics:test",
  ":core:link:test",
  ":core:domain:test",
  ":core:model:test",
  ":core:navigation:test",
  ":core:portability:test",
  ":core:testing:test",
  ":feature:analytics:testDebugUnitTest",
  ":feature:dashboard:testDebugUnitTest",
  ":feature:library:testDebugUnitTest",
  ":feature:plans:testDebugUnitTest",
  ":feature:practice:testDebugUnitTest",
  ":feature:privacy:testDebugUnitTest",
  ":feature:progress:testDebugUnitTest",
  ":feature:reminders:testDebugUnitTest",
  ":feature:reviews:testDebugUnitTest",
  ":feature:schedule:testDebugUnitTest",
  ":feature:search:testDebugUnitTest",
  ":feature:sessions:testDebugUnitTest",
  ":feature:settings:testDebugUnitTest",
  ":feature:subjects:testDebugUnitTest",
  ":feature:workspace:testDebugUnitTest",
  ":app:testReleaseUnitTest",
]
lint = [":app:lintDebug", ":app:lintRelease"]
clean = ["clean"]

[targets.studyflow_android.artifacts]
required = true
external_verification = "auto"

[targets.studyflow_android.validation]
android_safe = false
max_workers = 4
cpu_limit = 4
parallel = true
split_gradle = false
no_daemon = false
stop_daemon_after_phase = false
low_priority = false
gradle_heap_mb = 2048
gradle_metaspace_mb = 768
gradle_packaging_heap_mb = 2048
gradle_packaging_metaspace_mb = 768
gradle_lint_metaspace_mb = 768
memory_guard_mb = 0
affected_module_lint = false

[targets.studyflow_android.validation.phases]
preflight = ["verifyStudyFlowAndroidPreflightContracts"]
dependencies = []
compile = []
resources = []
unit-test = [
  "verifyOv09SflpNativeWebInterop",
  "verifyOv10SflpTrustSecurity",
  "verifyOv11SflpReconciliationRecovery",
  "verifySflp24FinalReleaseSeal",
  "verifyAttentionRoadmapPostsealCompletion",
  "verifyRel07Rel08FinalReleaseOpsSeal",
  "verifyFinalSourceAcceptance",
  ":core:data:testDebugUnitTest",
  ":core:database:testDebugUnitTest",
  ":core:diagnostics:test",
  ":core:link:test",
  ":core:domain:test",
  ":core:model:test",
  ":core:navigation:test",
  ":core:portability:test",
  ":core:testing:test",
  ":feature:analytics:testDebugUnitTest",
  ":feature:dashboard:testDebugUnitTest",
  ":feature:library:testDebugUnitTest",
  ":feature:plans:testDebugUnitTest",
  ":feature:practice:testDebugUnitTest",
  ":feature:privacy:testDebugUnitTest",
  ":feature:progress:testDebugUnitTest",
  ":feature:reminders:testDebugUnitTest",
  ":feature:reviews:testDebugUnitTest",
  ":feature:schedule:testDebugUnitTest",
  ":feature:search:testDebugUnitTest",
  ":feature:sessions:testDebugUnitTest",
  ":feature:settings:testDebugUnitTest",
  ":feature:subjects:testDebugUnitTest",
  ":feature:workspace:testDebugUnitTest",
  ":app:testReleaseUnitTest",
]
package = ["prepareDevtoolValidationArtifacts", ":app:assembleDebug"]
instrumentation = [
  ":core:database:connectedDebugAndroidTest",
  ":feature:workspace:connectedDebugAndroidTest",
  ":app:connectedReleaseAndroidTest",
]
lint = [":app:lintDebug", ":app:lintRelease"]


# SFDT-06 Phase A: native Devtool source-only shadow; deliberately manual and non-gating.
# Native compiler/executor live at devtool.actions_graph_export; StudyFlow never forks the DAG.
# Existing studyflow-ci.yml is still the sole authoritative fast/deep CI owner.
name: StudyFlow Devtool native source shadow
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: 'Exact reviewed 40-character StudyFlow source SHA'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: sfdt06-source-shadow-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  native-source-shadow:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      EXPECTED_SHA: ${{ inputs.expected_sha }}
      DEVTOOL_SOURCE_SHA: df2d306045619bc096c3bd18a68c3fb85023e4dd
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONNOUSERSITE: '1'
    steps:
      - name: Checkout exact consumer SHA
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Verify review source and dispatch identity
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$EXPECTED_SHA" = "$GITHUB_SHA"
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$RUNNER_OS" = Linux
          test "$RUNNER_ARCH" = X64
          test -z "$(git status --porcelain --untracked-files=normal)"
      - name: Pinned Python 3.12 for native provider
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Acquire immutable Devtool EXO runtime
        shell: bash
        run: |
          set -euo pipefail
          git clone --no-checkout https://github.com/Mikeyphw/devtool.git "$RUNNER_TEMP/sfdt06-devtool-source"
          git -C "$RUNNER_TEMP/sfdt06-devtool-source" checkout --detach "$DEVTOOL_SOURCE_SHA"
          test "$(git -C "$RUNNER_TEMP/sfdt06-devtool-source" rev-parse HEAD)" = "$DEVTOOL_SOURCE_SHA"
          python3 -m venv "$RUNNER_TEMP/sfdt06-devtool-env"
          "$RUNNER_TEMP/sfdt06-devtool-env/bin/python" -m pip install \
            --disable-pip-version-check --only-binary=:all: --no-deps \
            'pyyaml==6.0.3' 'rich==15.0.0' 'markdown-it-py==4.2.0' \
            'mdurl==0.1.2' 'pygments==2.20.0'
      - name: Check same-SHA legacy coverage inventory (read-only)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sfdt06"
          python3 -B scripts/sfdt06_shadow_contract.py --check --out "$RUNNER_TEMP/sfdt06/coverage.json"
      - name: Run four native Devtool source DAG nodes
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH="$RUNNER_TEMP/sfdt06-devtool-source" \
            "$RUNNER_TEMP/sfdt06-devtool-env/bin/python" -B scripts/sfdt06_native_shadow.py \
            --execute --out "$RUNNER_TEMP/sfdt06/native-source-shadow.json"
      - name: Preserve failure/incomplete attempt (never a PASS)
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sfdt06"
          if test ! -f "$RUNNER_TEMP/sfdt06/native-source-shadow.json"; then
            printf '{"kind":"studyflow.sfdt06.native-source-shadow","status":"FAILED_OR_NOT_RUN","source_sha":"%s","run_id":"%s","attempt":"%s","release_qualified":false,"legacy_equivalent":false}\n' \
              "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" \
              > "$RUNNER_TEMP/sfdt06/native-source-shadow.json"
          fi
      - name: Upload source-only native evidence (unqualified)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: studyflow-sfdt06-native-shadow-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/sfdt06/
            ${{ runner.temp }}/rm06-evidence/
          if-no-files-found: error
          retention-days: 14

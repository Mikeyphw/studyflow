# Cross-client CI. All jobs run without secrets, signing or publication permissions.
name: StudyFlow CI
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      lane:
        description: 'Client verification lane'
        required: true
        type: choice
        default: all
        options: [all, android, desktop, web, deep]
      expected_sha:
        description: 'Required for dispatch: reviewed 40-character commit SHA'
        required: true
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: studyflow-ci-${{ github.event_name }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: true
jobs:
  source:
    name: Actions integration source contract
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify checkout and mandatory dispatch source SHA
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
            test "$EXPECTED_SHA" = "$GITHUB_SHA"
          fi
      - name: Verify Devtool configuration and GitHub-only Gradle policies
        run: |
          python3 scripts/verify_studyflow_actions.py --source-only
          python3 scripts/studyflow_ci_gradle_profile.py --check-source
          python3 scripts/test_studyflow_ov01_r4_contracts.py
          python3 scripts/test_studyflow_ov01_r4r5_contracts.py
          python3 scripts/test_studyflow_ov01_r4r6_contracts.py
          python3 scripts/test_studyflow_ov01_r4r7_contracts.py
          python3 scripts/test_studyflow_ov01_r4r8_contracts.py
          python3 scripts/test_studyflow_ov01_r4r9_contracts.py
          python3 scripts/sflp08_09_formatting_preflight.py
          python3 scripts/test_studyflow_ov01_r4r10_contracts.py
  web:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.lane == 'all' || inputs.lane == 'web' }}
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned Python image-test dependency
        run: |
          python -m pip install --disable-pip-version-check --no-deps --only-binary=:all: -r requirements-test.txt
      - name: Install pinned web dependencies
        run: npm ci
      - name: Web tests
        run: npm test
      - name: Web lint
        run: npm run lint
      - name: Web bundle
        run: npm run build
      - name: Verify web release package
        run: npm run release:check
  desktop:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.lane == 'all' || inputs.lane == 'desktop' }}
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile and test headless desktop client
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon --max-workers=2 :desktopApp:classes :desktopApp:test
  android:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.lane == 'all' || inputs.lane == 'android' }}
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: app
            test_task: ':app:testReleaseUnitTest'
          - module: app-tv
            test_task: ':app-tv:testDebugUnitTest'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
      - name: Install pinned Android 36 / NDK 29 tools
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0' 'ndk;29.0.14206865'
      - uses: gradle/actions/setup-gradle@v4
      - name: Android build, JVM tests and lint
        shell: bash
        env:
          MODULE: ${{ matrix.module }}
          TEST_TASK: ${{ matrix.test_task }}
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon --max-workers=2 ":${MODULE}:assembleDebug" "$TEST_TASK" ":${MODULE}:lintDebug"
      - name: Preserve complete Android lint and JVM test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: studyflow-${{ matrix.module }}-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ matrix.module }}/build/reports/lint-results-*.xml
            ${{ matrix.module }}/build/reports/lint-results-*.html
            ${{ matrix.module }}/build/reports/lint-results-*.sarif
            ${{ matrix.module }}/build/reports/tests/**
            ${{ matrix.module }}/build/test-results/**
          if-no-files-found: warn
          retention-days: 14
      - name: Verify packaged debug APK
        id: output
        shell: bash
        env:
          MODULE: ${{ matrix.module }}
        run: |
          set -euo pipefail
          directory="${MODULE}/build/outputs/apk/debug"
          test -d "$directory" && test ! -L "$directory"
          mapfile -d '' -t packages < <(find "$directory" -maxdepth 1 -type f -name '*.apk' -print0)
          test "${#packages[@]}" -eq 1
          test ! -L "${packages[0]}"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "${packages[0]}"
          sha256sum "${packages[0]}"
          echo "package=${packages[0]}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: studyflow-${{ matrix.module }}-ci-debug-${{ github.run_id }}
          path: ${{ steps.output.outputs.package }}
          if-no-files-found: error
          retention-days: 7

  # Opt-in deep source/Gradle contracts: all Gradle work executes on GitHub, never Termux.
  # Each matrix cell uses the canonical, deduplicated .devtool.toml task profile.
  deep-contracts:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.lane == 'deep' }}
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    strategy:
      fail-fast: false
      matrix:
        profile:
          - android-contracts
          - tv-contracts
          - desktop-contracts
          - quality-contracts
          - parity-contracts
    name: Devtool ${{ matrix.profile }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Initialize pre-Gradle receipt (source-only)
        shell: bash
        env:
          STUDYFLOW_CI_PROFILE: ${{ matrix.profile }}
          STUDYFLOW_CI_RECEIPT: ${{ runner.temp }}/studyflow-devtool-profile.json
        run: |
          python3 scripts/studyflow_ci_gradle_profile.py --init-receipt "$STUDYFLOW_CI_PROFILE" --receipt "$STUDYFLOW_CI_RECEIPT"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned Python image-test dependency for cross-client contracts
        run: |
          python -m pip install --disable-pip-version-check --no-deps --only-binary=:all: -r web/requirements-test.txt
      - uses: android-actions/setup-android@v4
      - name: Install pinned Android SDK / NDK for contract graph
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0' 'ndk;29.0.14206865'
      - uses: gradle/actions/setup-gradle@v4
      - name: Node toolchain for cross-client parity
        if: ${{ matrix.profile == 'android-contracts' || matrix.profile == 'parity-contracts' }}
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install pinned TypeScript environment for native/Web contracts
        if: ${{ matrix.profile == 'android-contracts' || matrix.profile == 'parity-contracts' }}
        working-directory: web
        run: npm ci
      - name: Prepare web runtime for parity checks
        if: ${{ matrix.profile == 'parity-contracts' }}
        working-directory: web
        run: npm run build
      - name: Run canonical StudyFlow Devtool Gradle target profile
        shell: bash
        env:
          STUDYFLOW_CI_PROFILE: ${{ matrix.profile }}
          STUDYFLOW_CI_RECEIPT: ${{ runner.temp }}/studyflow-devtool-profile.json
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          python3 scripts/studyflow_ci_gradle_profile.py --run "$STUDYFLOW_CI_PROFILE" --receipt "$STUDYFLOW_CI_RECEIPT"
      - name: Verify successful hosted Gradle receipt
        shell: bash
        run: |
          set -euo pipefail
          jq -e '.status == "passed" and .exit_code == 0 and .build_executed == true' \
            "$RUNNER_TEMP/studyflow-devtool-profile.json"
      - name: Preserve complete phone lint diagnostics for deep contracts
        if: always() && matrix.profile == 'android-contracts'
        uses: actions/upload-artifact@v4
        with:
          name: studyflow-deep-android-lint-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            app/build/reports/lint-results-*.xml
            app/build/reports/lint-results-*.html
            app/build/reports/lint-results-*.sarif
            app/build/reports/tests/**
            app/build/test-results/**
          if-no-files-found: warn
          retention-days: 14
      - name: Preserve reviewed task plan and outcome (even on failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: studyflow-devtool-${{ matrix.profile }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/studyflow-devtool-profile.json
          if-no-files-found: warn
          retention-days: 14

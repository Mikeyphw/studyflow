name: StudyFlow SFDT22 Hosted Real Study Journeys
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sfdt22-study-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source:
    name: SFDT22 source and trust contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Source and exact manifest contracts
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=normal)"
          echo "46163469cd93425fc701492df13e08736ed342bae8780754309819bd88a23073  scripts/sfdt22_emulator_verify.py" | sha256sum --check --status
          echo "506ac2a2e71afe7d32fc7a8200cf13ba90caba3232a2b55e517c38bb2062109e  scripts/sfdt22_emulator_ci.sh" | sha256sum --check --status
          echo "0d9e72a5cd9bbd01b3d852d526974cc1ace3067c4e9160a75b38a5f8775b5185  app/src/androidTest/java/com/mikeyphw/studyflow/Sfdt22HostedStudyJourneyTest.kt" | sha256sum --check --status
          echo "53d32c91ac814074501ddebbcfc368812aad4d664282a7a6ca975fbc2622321f  feature/subjects/src/main/java/com/mikeyphw/studyflow/feature/subjects/StudyContentDialogs.kt" | sha256sum --check --status
          echo "82a314c22c2b5bf86e942b0186d0a3603c9ee4d0d99e52f1bb73d54c4545dcd1  feature/workspace/src/main/java/com/mikeyphw/studyflow/feature/workspace/WorkspaceUtilityScreens.kt" | sha256sum --check --status
          echo "b22486e751156118b7a8c09824fd609a1c28eb89c515be4b081ea4c31cdb189c  feature/plans/src/main/java/com/mikeyphw/studyflow/feature/plans/PlanListScreen.kt" | sha256sum --check --status
          echo "b5d0cd2bb44d893bc8564b0db2a72eb294d6edcfef3d888454681552c9f5977a  core/designsystem/src/main/java/com/mikeyphw/studyflow/core/designsystem/StudyFlowComponents.kt" | sha256sum --check --status
          echo "635f59b946d224e201966e56d7a0876a784dee8c31e27b0f99920d215cca83ff  feature/workspace/src/main/java/com/mikeyphw/studyflow/feature/workspace/WorkspaceCommon.kt" | sha256sum --check --status
          echo "2334ec3ab657082d58f48d07a6f7c46dc48960b85245fa6475334280cd592c0b  feature/subjects/src/main/java/com/mikeyphw/studyflow/feature/subjects/StudyContentScreen.kt" | sha256sum --check --status
          python3 -B scripts/test_sfdt22_emulator_contract.py
          python3 -B scripts/test_sfdt22_hf02_contract.py
          python3 -B scripts/test_sfdt22_hf03_contract.py
          python3 -B scripts/test_sfdt22_hf04_contract.py
          python3 -B scripts/test_sfdt22_hf05_contract.py
          echo "3ab00fc61634a0ea3e962ed2ec607d248ce9ad381b53f10e191e5faa52d4e6cb  scripts/test_sfdt22_hf07_contract.py" | sha256sum --check --status
          python3 -B scripts/test_sfdt22_hf06_contract.py
          python3 -B scripts/test_sfdt22_hf07_contract.py
          echo "5f081e64cafb7c5592be7439f7d3330d81e6c1c2a2b5360f21d50085738e8d21  scripts/test_sfdt22_hf06_contract.py" | sha256sum --check --status
          echo "2b485192f2e75a63d6c4961cfba1318a97662c02b794b177c39a958b62861ddb  scripts/test_sfdt22_hf08_contract.py" | sha256sum --check --status
          python3 -B scripts/test_sfdt22_hf08_contract.py
          echo "c69a268e879385dd4d95f4a5f80b7f8bf0165018e3fd2258e13b26d94d86777f  scripts/test_sfdt22_hf09_contract.py" | sha256sum --check --status
          python3 -B scripts/test_sfdt22_hf09_contract.py
          echo "054bc96146db45321705049482a8b4fca2e7d1a9d2ea6987da0a9e89d1692cff  scripts/test_sfdt22_hf10_contract.py" | sha256sum --check --status
          python3 -B scripts/test_sfdt22_hf10_contract.py
          echo "015fcd1191c15b1854ea1dce89cfd40419b0d6656dc432abb179524e980fc9df  scripts/test_sfdt22_hf11_contract.py" | sha256sum --check --status
          python3 -B scripts/test_sfdt22_hf11_contract.py
          echo "e36a52c836c9878ec18b52e556ecf8ba5ddae09be979f7079db0db2674267679  scripts/test_sfdt22_hf12_contract.py" | sha256sum --check --status
          python3 -B scripts/test_sfdt22_hf12_contract.py
          echo "e1c0ca03f91d4260c6e6956a0cd845a52bec72555f30b113d9b901efc96ea8e9  scripts/test_sfdt22_hf13_contract.py" | sha256sum --check --status
          echo "f83faeb504cf2155ec0fa74d55a350f26ee9a165dd0db429384ce41a6fb607e7  docs/actions/SFDT22_HF13_TOPIC_PERSISTENCE_AND_EXPANSION.md" | sha256sum --check --status
          python3 -B scripts/test_sfdt22_hf13_contract.py
          echo "500686b8b5747d4a3b32cd107db69a334d5dbd8b2caba14ccf87b182bb89cf63  scripts/test_sfdt22_hf15_contract.py" | sha256sum --check --status
          echo "ff0eee2078d10be6b709bce92e39b74e8d402f086d3148b2a6d7e2eb32dd9694  docs/actions/SFDT22_HF15_CI_FAILURE_REMEDIATION.md" | sha256sum --check --status
          python3 -B scripts/test_sfdt22_hf15_contract.py
          echo "134a060fe19dee1fab5bcabfc54b2591ecd8160c0fc859a2cd67149aee3d260f  feature/sessions/src/main/java/com/mikeyphw/studyflow/feature/sessions/StudySessionScreen.kt" | sha256sum --check --status
          echo "9ed84227998473d61414b90fc2d430514cbe85e13dfa6886ec1f660d5fd4f88e  feature/sessions/src/main/java/com/mikeyphw/studyflow/feature/sessions/StudySessionDialogs.kt" | sha256sum --check --status
          echo "318d4576400aaacb1dbbb4740c49e65aab74a8d918e0b89e03dda75a731092bf  scripts/test_sfdt22_hf16_contract.py" | sha256sum --check --status
          echo "993ce5ea04f9c32d84fc80010b4e5e74f680be9f5d19e3c52d0254af1d049a3d  docs/actions/SFDT22_HF16_SESSION_WORKFLOW_ACCEPTANCE.md" | sha256sum --check --status
          python3 -B scripts/test_sfdt22_hf16_contract.py
          python3 -B scripts/test_sfdt22_hf01_contract.py
          python3 -B scripts/sfdt22_emulator_verify.py --source-check
          python3 -B scripts/test_sfdt21_emulator_contract.py
          python3 -B scripts/sfdt11_contract.py --source-check
  emulator:
    name: SFDT22 API36 real study-workflow instrumentation
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 105
    env:
      CI: 'true'
      PYTHONDONTWRITEBYTECODE: '1'
      STUDYFLOW_SFDT21_HOSTED_EMULATOR: 'true' # reuse reviewed debug-only Gradle testBuildType gate
      STUDYFLOW_SFDT22_HOSTED_JOURNEYS: 'true'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Require exact disposable checkout and initialize NOT_RUN receipt
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$RUNNER_OS" = Linux
          test "$RUNNER_ARCH" = X64
          test "$GITHUB_REPOSITORY" = Mikeyphw/studyflow
          test -z "$(git status --porcelain --untracked-files=normal)"
          test -z "${STUDYFLOW_RELEASE_STORE_PASSWORD:-}${STUDYFLOW_RELEASE_KEY_PASSWORD:-}${STUDYFLOW_RELEASE_STORE_FILE:-}"
          mkdir -p "$RUNNER_TEMP/sfdt22-emulator"
          printf '%s\n' '{"overall":"NOT_RUN","hosted_emulator_only":true,"physical_device_qualified":false,"release_qualified":false,"publication_allowed":false}' > "$RUNNER_TEMP/sfdt22-emulator/SFDT22_EVIDENCE.json"
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          cmdline-tools-version: 15859902
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0 ndk;29.0.14206865'
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c
        with:
          cache-disabled: true
          gradle-version: '9.7.1'
      - name: Compile production app and actual instrumentation APK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --max-workers=2 --console=plain :app:assembleDebug :app:assembleDebugAndroidTest
          test -s app/build/outputs/apk/debug/app-debug.apk
          test -s app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          test ! -e app/build/outputs/apk/release/app-release.apk
      - name: Verify source SHA, APKs, and actual signer before emulator
        shell: bash
        run: |
          set -euo pipefail
          python3 -B scripts/sfdt22_emulator_verify.py --preflight-apks \
            --output-dir "$RUNNER_TEMP/sfdt22-emulator" \
            --source-sha "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT"
      - name: Require hosted Linux KVM and install Android 16 image
        shell: bash
        run: |
          set -euo pipefail
          test -c /dev/kvm
          if [[ ! -r /dev/kvm || ! -w /dev/kvm ]]; then sudo chmod a+rw /dev/kvm; fi
          test -r /dev/kvm && test -w /dev/kvm
          for i in 1 2 3; do
            if sdkmanager --install 'system-images;android-36;google_apis;x86_64'; then break; fi
            if [[ "$i" == 3 ]]; then echo SFDT22_IMAGE_UNAVAILABLE >&2; exit 1; fi
            sleep 10
          done
      - name: Five real production UI journeys and cold-start persistence
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 2
          ram-size: 2048M
          disk-size: 3072M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash scripts/sfdt22_emulator_ci.sh
      - name: Independently verify five test receipts, new PID, seven unique screenshots
        shell: bash
        run: |
          set -euo pipefail
          python3 -B scripts/sfdt22_emulator_verify.py --verify \
            --output-dir "$RUNNER_TEMP/sfdt22-emulator" \
            --source-sha "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT"
      - name: Upload minimized acceptance artifacts even on failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: sfdt22-hosted-journeys-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sfdt22-emulator/
          if-no-files-found: error
          retention-days: 14
  gate:
    name: SFDT22 hosted real-study UI gate
    if: always()
    needs: [source, emulator]
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Require source and emulator success, not merely test discovery
        env:
          SOURCE_RESULT: ${{ needs.source.result }}
          EMULATOR_RESULT: ${{ needs.emulator.result }}
        run: |
          set -euo pipefail
          test "$SOURCE_RESULT" = success
          test "$EMULATOR_RESULT" = success
          echo SFDT22_HOSTED_REAL_STUDY_JOURNEYS_PASS

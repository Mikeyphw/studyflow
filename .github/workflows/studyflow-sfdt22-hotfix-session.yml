name: StudyFlow SFDT22 Focused Session Diagnosis (nonqualifying)
on:
  pull_request:
    types: [labeled]
  workflow_call:
    inputs:
      expected_sha:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      expected_sha:
        description: 'Required reviewed 40-character checkout SHA'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: sfdt22-hotfix-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  source:
    if: ${{ (github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name == 'sfdt22-hotfix-session' && github.event.pull_request.head.repo.full_name == 'Mikeyphw/studyflow') || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.repository == 'Mikeyphw/studyflow' && startsWith(github.ref, 'refs/heads/sfdt22-hotfix/')) }}
    name: Exact source and nonqualifying hotfix contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Enforce exact checkout, no secrets, and source tests
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$GITHUB_REPOSITORY" = Mikeyphw/studyflow
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] || [ "$GITHUB_EVENT_NAME" = push ]; then
            [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
            test "$EXPECTED_SHA" = "$GITHUB_SHA"
          fi
          test -z "$(git status --porcelain --untracked-files=normal)"
          python3 -B scripts/test_sfdt22_hf22_contract.py
          python3 -B scripts/test_sfdt27_diag_contract.py
          python3 -B scripts/test_sfdt27_diag02_contract.py
          python3 -B scripts/test_sfdt27_fix03_contract.py
          python3 -B scripts/test_sfdt27_fix03_hf02_contract.py
          python3 -B scripts/test_sfdt27_fix03_hf03_contract.py
          python3 -B scripts/test_sfdt22_hf29_subject_fab_contract.py
          python3 -B scripts/test_sfdt22_hf30_session_navigation_contract.py
          python3 -B scripts/test_sfdt22_hf30_hf05_completion_contract.py
          python3 -B scripts/test_sfdt22_hf30_hf07_diagnostics_contract.py
          python3 -B scripts/sfdt22_emulator_verify.py --source-check
  # PR-label opt-in or manual exact-SHA dispatch; never release qualifying.
  # Runs the first FOUR real hosted journeys, including Practice/review; NOT full qualification.
  session-diagnostic:
    if: ${{ (github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name == 'sfdt22-hotfix-session' && github.event.pull_request.head.repo.full_name == 'Mikeyphw/studyflow') || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.repository == 'Mikeyphw/studyflow' && startsWith(github.ref, 'refs/heads/sfdt22-hotfix/')) }}
    name: SFDT22 focused hotfix diagnosis (NOT full qualification)
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      CI: 'true'
      PYTHONDONTWRITEBYTECODE: '1'
      STUDYFLOW_SFDT21_HOSTED_EMULATOR: 'true'
      STUDYFLOW_SFDT22_HOSTED_JOURNEYS: 'true'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Enforce reviewed SHA and initialize non-qualifying receipt
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          GITHUB_EVENT_ACTION: ${{ github.event.action }}
          GITHUB_EVENT_LABEL: ${{ github.event.label.name }}
          GITHUB_PR_SOURCE_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] || [ "$GITHUB_EVENT_NAME" = push ]; then
            [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
            test "$EXPECTED_SHA" = "$GITHUB_SHA"
            if [ "$GITHUB_EVENT_NAME" = push ]; then
              test "$GITHUB_REPOSITORY" = Mikeyphw/studyflow
              case "$GITHUB_REF" in refs/heads/sfdt22-hotfix/*) ;; *) exit 2 ;; esac
            fi
          else
            test "$GITHUB_EVENT_NAME" = pull_request
            test "$GITHUB_EVENT_ACTION" = labeled
            test "$GITHUB_EVENT_LABEL" = sfdt22-hotfix-session
            test "$GITHUB_PR_SOURCE_REPO" = Mikeyphw/studyflow
          fi
          test "$RUNNER_OS" = Linux
          test "$RUNNER_ARCH" = X64
          test "$GITHUB_REPOSITORY" = Mikeyphw/studyflow
          test -z "$(git status --porcelain --untracked-files=normal)"
          test -z "${STUDYFLOW_RELEASE_STORE_PASSWORD:-}${STUDYFLOW_RELEASE_KEY_PASSWORD:-}${STUDYFLOW_RELEASE_STORE_FILE:-}"
          mkdir -p "$RUNNER_TEMP/sfdt22-emulator"
          printf '%s\n' '{"overall":"NOT_RUN","release_qualified":false,"publication_allowed":false,"diagnostic_only":true}' > "$RUNNER_TEMP/sfdt22-emulator/SFDT22_EVIDENCE.json"
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          cmdline-tools-version: 15859902
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0 ndk;29.0.14206865'
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c
        with:
          cache-read-only: true
          gradle-version: '9.7.1'
      - name: Compile only debuggable app and instrumentation APK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --max-workers=2 --console=plain :app:assembleDebug :app:assembleDebugAndroidTest
          test -s app/build/outputs/apk/debug/app-debug.apk
          test -s app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          test ! -e app/build/outputs/apk/release/app-release.apk
      - name: Check exact debug APK, test APK and signing identity
        shell: bash
        run: |
          set -euo pipefail
          python3 -B scripts/sfdt22_emulator_verify.py --preflight-apks \
            --output-dir "$RUNNER_TEMP/sfdt22-emulator" \
            --source-sha "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT"
      - name: Require disposable KVM and Android 16 image
        shell: bash
        run: |
          set -euo pipefail
          test -c /dev/kvm
          if [[ ! -r /dev/kvm || ! -w /dev/kvm ]]; then sudo chmod a+rw /dev/kvm; fi
          test -r /dev/kvm && test -w /dev/kvm
          sdkmanager --install 'system-images;android-36;google_apis;x86_64'
      - name: Plan -> subjects/topics -> Quick Session on REAL production UI
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 2
          ram-size: 2048M
          disk-size: 3072M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: python3 -B scripts/sfdt22_emulator_verify.py --run --diagnostic-through practice --output-dir "$RUNNER_TEMP/sfdt22-emulator" --source-sha "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT"
      - name: Require real test receipts and identity checkpoints, NO full gate
        shell: bash
        run: |
          set -euo pipefail
          python3 -B scripts/sfdt22_emulator_verify.py --verify-diagnostic --diagnostic-through practice \
            --output-dir "$RUNNER_TEMP/sfdt22-emulator" \
            --source-sha "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT"
      - name: HF07 summarize failed Android stage (always, no qualification bypass)
        if: always()
        shell: bash
        run: |
          python3 -B scripts/sfdt22_hf30_hf07_diagnostics.py report --mode focused \
            --output-dir "$RUNNER_TEMP/sfdt22-emulator" \
            --source-sha "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT"
      - name: Upload bounded and sanitized hotfix diagnostics even on failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: sfdt22-hotfix-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sfdt22-emulator/
          if-no-files-found: error
          retention-days: 14
